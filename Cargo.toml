[package]
name         = "large-wet-dog"
version      = "0.1.0"
edition      = "2024"
description  = "A discord bot to fix embed fails."
repository   = "https://github.com/Scripter17/large-wet-dog"
keywords     = []
categories   = []
license      = "AGPL-3.0-or-later"
readme       = "README.md"
rust-version = "1.98"

[dependencies]
serenity  = { git = "https://github.com/serenity-rs/serenity", branch = "next" }
clap      = { version = "4.6.6" , features = ["derive"] }
tokio     = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
regex     = "1.13.1"
thiserror = "2.0.20"
